name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the engine
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: python-full (the [[regressions]] command)
        run: python3 tests/test_handsoff_supervisor.py
      - name: dashboard-full (the [[regressions]] command)
        run: node --test tests/dashboard/*.test.js
      - name: the per-module suites the criteria cite
        run: python3 -m unittest discover -s tests -p "test_*.py" -q
