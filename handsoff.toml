[project]
name = "project-handsoff"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
small_fix_max_criteria = 3
small_fix_max_changed_lines = 200
small_fix_max_files = 6
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
# Every role here is set explicitly and happens to equal the recommended
# crew (README "Default crew"): a role whose key is absent, or still holds
# the legacy "configure-me" placeholder, gets that same recommended profile
# and is reported with source "recommended" instead of "explicit".
# Recommended adapters: claude for architect, supervisor, and implementer;
# codex for the reviewer, so the critique comes from an independent
# provider family. Setting one role never changes the other three.
# "auto" is an explicit choice, not a placeholder: it keeps the older
# first-installed auto-detect path (Codex, then Claude Code).
architect = "codex"
supervisor = "codex"
implementer = "codex"
reviewer = "codex"

[models]
# Use "default" to inherit the runner's configured model, or enter an exact
# model ID/alias supported by the selected adapter. Recommended models, used
# when a role's key is absent: claude-opus-5 for architect, supervisor, and
# implementer (premium reasoning on design, and the same Opus profile kept
# for orchestration and implementation by operator preference); "default"
# for the codex reviewer. A recommended model applies only with its
# recommended adapter: override an adapter without naming a model and the
# role runs with the runner default (source "runner_default").
architect = "default"
supervisor = "default"
implementer = "default"
reviewer = "default"

[fallback_policy]
# Ordered replacement profiles used only by the pure fallback planner.
# "auto" is intentionally not valid here: every fallback is explicit.
max_failovers_per_role = 2
architect = []
supervisor = []
implementer = []
reviewer = []

[agent_budget]
# Hard per-session Codex rollout ceilings. Budget exhaustion stops the role
# and pauses for the Pilot; it never launches a fallback and spends again.
architect = 40000
supervisor = 24000
implementer = 80000
reviewer = 80000

[recovery]
enabled = true
max_attempts = 3
lease_minutes = 15
worker_loss_grace_minutes = 2
live_session_silence_minutes = 10
liveness_seconds = 60
dashboard_watchdog = true
poll_seconds = 30

[checks]
# Shell commands the supervisor actually runs via `handsoff_supervisor.py verify`.
# Each criterion's evidence should point at one of these having run, not a
# free-text claim. Example: commands = ["pytest tests/ -q", "npm test"]
# None of these runs the whole suite. Full regressions belong under
# [[regressions]] (issue #28) and are gated behind Mission Control
# Accept/Decline.
commands = [
  "python3 -m unittest tests.test_design_review_hold -v",
  "python3 -m unittest tests.test_host_roles -v",
  "python3 -m unittest tests.test_work_items -v",
  "python3 -m unittest tests.test_packaging -v",
  "python3 -m unittest tests.test_handsoff_supervisor.TestSmallFixLane -v",
  "node --test tests/dashboard/work_item_lanes.test.js",
  "python3 -m unittest tests.test_handsoff_supervisor.TestBacklogPlanner -v",
  "node --test tests/dashboard/tranche_planner.test.js",
  "python3 -m unittest tests.test_handsoff_supervisor.TestRecoveryNoManagedSession -v",
]
# Commands that verify the deployed system. Phase 8 is blocked until these
# run successfully after deployment approval.
live_commands = ["python3 tests/live_doctor_smoke.py", "python3 tests/live_host_roles_smoke.py"]
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 600

[regression_gate]
approval_timeout_minutes = 30
launch_window_minutes = 10
full_regression_major_only = true

[[regressions]]
name = "python-full"
commands = ["python3 tests/test_handsoff_supervisor.py"]

[[regressions]]
name = "dashboard-full"
commands = ["node --test tests/dashboard/*.test.js"]
