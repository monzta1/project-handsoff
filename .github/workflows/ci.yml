name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# The two [[regressions]] from handsoff.toml. python-full's one versioned
# inventory is dealt across five count-balanced runners by tests/shard.py;
# collection and execution isolate modules that cannot share an interpreter.
# `tests` is the check main requires; it only gathers the shard results, so
# the required context stays one name however the matrix changes.
jobs:
  # #227: a pull request that touches only Markdown (or docs/) is docs-only:
  # the docs job runs alone and the required `tests` check reports from it.
  # Anything else, and every push to main, runs the full matrix.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          docs_only=true
          for f in $files; do
            case "$f" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done
          [ -n "$files" ] || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: The docs suites (the documentation audit gates inside tests.test_landing_page)
        # test_the_audit_finds_nothing_new runs `handsoff doctor --docs-only .` and fails
        # on any finding on README.md or any finding main did not already carry, so
        # the audit gates this job through the suite; there is no non-gating call.
        run: python3 -m unittest tests.test_landing_page tests.test_governance_docs tests.test_docs_only_path -v
  python:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: python (shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the engine
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: python-full, one shard
        run: python3 tests/shard.py --all --total 5 --index ${{ matrix.shard }}
  dashboard:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: dashboard-full
        run: node --test tests/dashboard/*.test.js
  tests:
    needs: [changes, python, dashboard, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The docs job on a docs-only change; every shard, every module and the dashboard suite otherwise
        run: |
          echo "docs_only: ${{ needs.changes.outputs.docs_only }}; docs: ${{ needs.docs.result }}; python: ${{ needs.python.result }}; dashboard: ${{ needs.dashboard.result }}"
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            test "${{ needs.docs.result }}" = "success"
          else
            test "${{ needs.python.result }}" = "success" && test "${{ needs.dashboard.result }}" = "success"
          fi
