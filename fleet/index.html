<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Handsoff // Fleet Mission Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307090c'/%3E%3Cg fill='%235fd3ff'%3E%3Ccircle cx='8' cy='9' r='2'/%3E%3Ccircle cx='16' cy='16' r='3'/%3E%3Ccircle cx='25' cy='8' r='2'/%3E%3Ccircle cx='24' cy='24' r='2'/%3E%3Ccircle cx='7' cy='25' r='2'/%3E%3C/g%3E%3Cg stroke='%235fd3ff' stroke-width='1' opacity='.55'%3E%3Cpath d='M8 9l8 7 9-8M16 16l8 8M16 16l-9 9'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Handsoff Fleet Mission Control">
        <img class="brand-mark" src="/logo.png" alt="Handsoff" width="40" height="40">
        <span class="brand-copy"><strong>HANDSOFF</strong><small>FLEET MISSION CONTROL</small></span>
      </a>
      <div class="topbar-mission">
        <p class="eyebrow">SUPERDASH</p>
        <h1>Every registered mission, one screen</h1>
      </div>
      <div class="topbar-meta">
        <span class="lcd lcd-small" id="fleet-clock" data-frozen="true" title="Longest-running active mission"><span class="lcd-ghost" aria-hidden="true">88:88:88</span><span class="lcd-live">00:00:00</span></span>
        <span class="connection"><i></i><span id="link">LINK: CONNECTING</span></span>
        <span id="synced" class="last-sync">ACQUIRING</span>
      </div>
    </header>
    <div id="offline-banner" class="offline-banner hidden" role="alert"></div>

    <main>
      <section id="decisions" class="panel decisions-panel hidden" aria-live="polite">
        <div class="section-head"><div><p class="panel-label">PILOT DECISIONS</p><h2>Waiting on you</h2></div><strong id="decision-count" class="count-badge">0</strong></div>
        <div id="decision-list" class="decision-list"></div>
      </section>

      <section class="summary" id="summary" aria-label="Fleet state counts"></section>

      <section class="panel fleet-panel">
        <div class="section-head"><div><p class="panel-label">ONGOING MISSIONS</p><h2>Mission fleet</h2></div><span id="fleet-count" class="section-meta">0 PROJECTS</span></div>
        <div id="projects" class="projects"></div>
        <details id="finished-runs" class="finished-runs hidden">
          <summary><span class="panel-label">COMPLETED, CLOSED AND IDLE</span><span id="finished-count" class="section-meta">0 RUNS</span></summary>
          <div id="finished-projects" class="projects"></div>
        </details>
      </section>
    </main>
  </div>
  <dialog id="confirm" class="confirm-dialog">
    <form method="dialog">
      <p class="panel-label">HIGH-IMPACT OPERATION</p>
      <h2 id="confirm-title"></h2>
      <pre id="confirm-context"></pre>
      <label id="reason-wrap">REASON<input id="reason" maxlength="512"></label>
      <div class="confirm-actions"><button value="cancel" class="secondary">CANCEL</button><button id="confirm-go" value="default" class="danger">CONFIRM EXACT OPERATION</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
