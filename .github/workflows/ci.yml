name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# The two [[regressions]] from handsoff.toml. python-full is dealt across six
# runners by tests/shard.py (weights in tests/shard_weights.json), so the wall
# time is one shard, about 90 s, not the 8.5 min of the whole file (#179).
# `tests` is the check main requires; it only gathers the shard results, so
# the required context stays one name however the matrix changes.
jobs:
  python:
    name: python (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the engine
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: python-full, one shard
        run: python3 tests/shard.py --total 6 --index ${{ matrix.shard }}
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: dashboard-full
        run: node --test tests/dashboard/*.test.js
  tests:
    needs: [python, dashboard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard and the dashboard suite passed
        run: |
          echo "python: ${{ needs.python.result }}; dashboard: ${{ needs.dashboard.result }}"
          test "${{ needs.python.result }}" = "success" && test "${{ needs.dashboard.result }}" = "success"
