[project]
name = "project-handsoff"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
# "auto" selects the first installed adapter in this order: Codex, then
# Claude Code. Set any role explicitly to override its automatic choice.
architect = "codex"
supervisor = "codex"
implementer = "codex"
reviewer = "codex"

[models]
# Use "default" to inherit the runner's configured model, or enter an exact
# model ID/alias supported by the selected adapter.
architect = "default"
supervisor = "default"
implementer = "default"
reviewer = "default"

[fallback_policy]
# Ordered replacement profiles used only by the pure fallback planner.
# "auto" is intentionally not valid here: every fallback is explicit.
max_failovers_per_role = 2
architect = []
supervisor = []
implementer = []
reviewer = []

[checks]
# Shell commands the supervisor actually runs via `handsoff_supervisor.py verify`.
# Each criterion's evidence should point at one of these having run, not a
# free-text claim. Example: commands = ["pytest tests/ -q", "npm test"]
# Focused checks for the self-hosted governance run (issues #31, #30, #28,
# #29 and the cross-feature cases). One narrow file per ticket area; none of
# these runs the whole suite. Full regressions belong under [[regressions]]
# (issue #28) and are gated behind Mission Control Accept/Decline.
commands = [
  "python3 tests/test_review_attempts.py",
  "python3 tests/test_supervisor_recovery.py",
  "python3 tests/test_regression_gate.py",
  "python3 tests/test_work_items.py",
  "python3 tests/test_governance_cross.py",
  "python3 tests/test_governance_docs.py",
  "node --test tests/dashboard/review_round.test.js",
  "node --test tests/dashboard/work_items.test.js",
  "node --test tests/dashboard/regression_gate.test.js",
  "node --test tests/browser/regression_gate.browser.test.js",
  "node --test tests/browser/work_items.browser.test.js",
  "node --test tests/browser/escalation.browser.test.js",
]
# Commands that verify the deployed system. Phase 8 is blocked until these
# run successfully after deployment approval.
live_commands = []
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 600

# Temporary observation-only bootstrap for the self-hosted governance run
# (issues #28-#31). This is NOT the implementation of #29; it exists so the
# operator can watch all four issues on Mission Control while #29 replaces
# manual ticket configuration with derived work-item state.
[[tickets]]
number = 31
title = "Track review attempts structurally and enforce convergence limits"
status = "in_progress"
url = "https://github.com/monzta1/project-handsoff/issues/31"

[[tickets]]
number = 30
title = "Supervisor leaves stalled runs without automatic remediation"
status = "not_started"
url = "https://github.com/monzta1/project-handsoff/issues/30"

[[tickets]]
number = 28
title = "Hard-gate full regressions behind Mission Control Accept/Decline"
status = "not_started"
url = "https://github.com/monzta1/project-handsoff/issues/28"

[[tickets]]
number = 29
title = "Automatically show per-ticket status table for multi-item runs"
status = "not_started"
url = "https://github.com/monzta1/project-handsoff/issues/29"
