[project]
# logo = "docs/img/logo.png"   # optional project artwork for Mission Control and Fleet (png, jpg, webp or svg inside the project)
name = "handsoff-project"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
# Automatically launch the next managed role from an owned dashboard.
auto_handoff = true
max_design_rounds = 3
max_review_rounds = 3
max_autonomous_design_reviews = 2
stall_minutes = 10
small_fix_max_criteria = 3
small_fix_max_changed_lines = 200
small_fix_max_files = 6
require_live_verification = true
deployment_requires_explicit_approval = true

[fallback_policy]
max_failovers_per_role = 2
architect = []
supervisor = []
implementer = []
reviewer = []

[agent_budget]
# Per-adapter defaults: Codex architect 40000, supervisor 24000, implementer 80000, reviewer 80000.
architect = 40000
supervisor = 24000
implementer = 80000
reviewer = 80000
# Optional follow-up design budget. Without it, derive from packet size with a 40000 minimum.
# followup_design = 40000

[adapters]
# Optional absolute or project-relative executable overrides.
# codex = "/path/to/codex"
# claude = "/path/to/claude"

[recovery]
enabled = true
max_attempts = 3
lease_minutes = 15
# Grace period after an external operation's declared timeout before safe termination.
operation_grace_seconds = 120
worker_loss_grace_minutes = 2
live_session_silence_minutes = 10
liveness_seconds = 60
dashboard_watchdog = true
poll_seconds = 30

# Explicit per-role fail-fast policy (#102): a live session that has produced
# no output line for this many minutes is ended with a ledgered reason and
# replaced through the normal recovery path. 0 disables the policy for that
# role. This is distinct from live_session_silence_minutes, which only
# presumes a session lost when its process is gone.
[recovery.protocol_silence_minutes]
architect = 0
supervisor = 0
implementer = 0
reviewer = 0

[checks]
commands = []
live_commands = []
timeout_seconds = 600

[digest]
# Optional glob patterns excluded from repository evidence digests. A match
# applies to the full relative path and to any path component.
ignore = []

[regression_gate]
approval_timeout_minutes = 30
launch_window_minutes = 10
full_regression_major_only = true

[dashboard]
# Exact browser origins (scheme://host[:port]) allowed to drive Mission
# Control through a tunnel or private network (#124). Loopback is always
# allowed. See docs/REMOTE-ACCESS.md; the app itself has no login.
public_origins = []
