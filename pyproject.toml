[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-handsoff"
version = "0.3.78"
description = "A lean, auditable multi-agent software-delivery control plane"
readme = "PACKAGE.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Moncy Abraham"}]

[project.optional-dependencies]
# #190: the live checks drive headless Chrome over its DevTools socket
# (tests/live_offline_smoke.py) and need websockets in the interpreter that
# runs them; declared here so the dedicated environment carries it.
live = ["websockets>=12"]

[project.scripts]
handsoff = "handsoff_cli:main"
handsoff-supervisor = "handsoff_supervisor:main"
handsoff-agent = "handsoff_agent:main"
handsoff-fleet = "handsoff_fleet:main"

[tool.setuptools]
package-dir = {"" = "bin"}
py-modules = [
  "handsoff_agent", "handsoff_broker", "handsoff_cli",
  "handsoff_dashboard", "handsoff_fleet", "handsoff_fleet_signals", "handsoff_lib", "handsoff_manifest",
  "handsoff_progress", "handsoff_regress", "handsoff_supervisor", "handsoff_tranche", "handsoff_update", "validate_handsoff_status"
]

[tool.setuptools.data-files]
"share/handsoff" = ["handsoff-runtime.json"]
"share/handsoff/dashboard" = ["dashboard/app.js", "dashboard/index.html", "dashboard/logo.png", "dashboard/regression.html", "dashboard/regression.js", "dashboard/styles.css"]
"share/handsoff/dashboard/lib" = ["dashboard/lib/dashboard-logic.js", "dashboard/lib/run-vocabulary.js"]
"share/handsoff/fleet" = ["fleet/app.js", "fleet/index.html", "fleet/metrics.html", "fleet/metrics.js", "fleet/styles.css"]
"share/handsoff/playbook" = ["playbook/INDEX.md", "playbook/index.json", "playbook/landing.md", "playbook/lanes.md", "playbook/lessons.md", "playbook/protocol.md", "playbook/reviewers.md"]
"share/handsoff/prompts" = ["prompts/architect.md", "prompts/implementer.md", "prompts/reviewer.md", "prompts/supervisor.md"]
"share/handsoff/rules" = ["rules/README.md", "rules/reviewer-launch-phase-1.json", "rules/reviewer-packet-finding-length.json", "rules/reviewer-packet-tests-executed.json"]
"share/handsoff/schemas" = ["schemas/acceptance.schema.json", "schemas/status.schema.json", "schemas/snapshot.schema.json"]
"share/handsoff/templates" = ["templates/handsoff.toml"]
