# #163: publish metrics.tonecommand.com on every push to main that touches the
# site or the Fleet page code it reuses.
#
# Needs three repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN    an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID   the account that owns the "handsoff-metrics" Pages project
#   METRICS_GITHUB_TOKEN    a read-only GitHub token for the repositories the site shows
# and one repository variable (Settings, Secrets and variables, Actions, Variables):
#   METRICS_REPOS           optional: an explicit owner/repo list. EMPTY (the
#                           default) means every repository the token owns, so a
#                           new one appears without anybody editing a list.
# The Pages project itself is created by this workflow on first run; the custom
# domain and the Access policy are console steps (docs/METRICS-SITE.md).
name: metrics-site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - fleet/metrics.js
      - fleet/styles.css
      - ".github/workflows/metrics-site.yml"
  workflow_dispatch:

concurrency:
  group: metrics-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 web/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create the Pages project when it does not exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create handsoff-metrics --production-branch main || echo "project exists"
      - name: Put the GitHub token into the project's secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          METRICS_GITHUB_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN }}
        run: printf '%s' "$METRICS_GITHUB_TOKEN" | npx --yes wrangler@3 pages secret put GITHUB_TOKEN --project-name handsoff-metrics
      - name: Set or clear the explicit repository list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          METRICS_REPOS: ${{ vars.METRICS_REPOS }}
        # An EMPTY list must DELETE the secret, not skip the step. Skipping
        # would leave whatever was last pushed sitting in the Pages project,
        # so clearing the variable would appear to do nothing and the site
        # would go on showing a list nobody could find any more.
        run: |
          if [ -n "$METRICS_REPOS" ]; then
            printf '%s' "$METRICS_REPOS" | npx --yes wrangler@3 pages secret put METRICS_REPOS --project-name handsoff-metrics
          else
            echo "METRICS_REPOS is empty: the site lists every repository the token owns"
            npx --yes wrangler@3 pages secret delete METRICS_REPOS --project-name handsoff-metrics 2>&1 || \
              echo "(no METRICS_REPOS secret to remove, which is the wanted state)"
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name handsoff-metrics --branch main
