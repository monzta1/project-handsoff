<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Handsoff // Fleet Metrics</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307090c'/%3E%3Cg fill='%235fd3ff'%3E%3Ccircle cx='8' cy='9' r='2'/%3E%3Ccircle cx='16' cy='16' r='3'/%3E%3Ccircle cx='25' cy='8' r='2'/%3E%3Ccircle cx='24' cy='24' r='2'/%3E%3Ccircle cx='7' cy='25' r='2'/%3E%3C/g%3E%3Cg stroke='%235fd3ff' stroke-width='1' opacity='.55'%3E%3Cpath d='M8 9l8 7 9-8M16 16l8 8M16 16l-9 9'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Handsoff Fleet Mission Control">
        <img class="brand-mark" src="/logo.png" alt="Handsoff" width="40" height="40">
        <span class="brand-copy"><strong>HANDSOFF</strong><small>FLEET MISSION CONTROL</small></span>
      </a>
      <div class="topbar-mission">
        <p class="eyebrow">METRICS</p>
        <h1>Issue throughput, every project</h1>
      </div>
      <div class="topbar-meta">
        <nav class="tabs" aria-label="Fleet pages"><a href="/">MISSIONS</a><a href="/metrics" aria-current="page">METRICS</a></nav>
        <span id="engine-badge" class="engine-badge" title="Engine the Fleet server runs">ENGINE UNKNOWN</span>
        <span class="connection"><i></i><span id="link">LINK: CONNECTING</span></span>
        <span id="synced" class="last-sync">ACQUIRING</span>
      </div>
    </header>

    <main>
      <section class="panel filters-panel" aria-label="Filters">
        <div class="filters">
          <div class="preset-row" role="group" aria-label="Date range">
            <button type="button" data-preset="today">TODAY</button>
            <button type="button" data-preset="7">7 DAYS</button>
            <button type="button" data-preset="30" class="active">30 DAYS</button>
            <button type="button" data-preset="90">90 DAYS</button>
            <button type="button" data-preset="all">ALL</button>
            <button type="button" data-preset="custom">CUSTOM</button>
          </div>
          <div id="custom-range" class="custom-range hidden">
            <label>FROM <input id="from" type="date"></label>
            <label>TO <input id="to" type="date"></label>
          </div>
          <label class="project-filter">PROJECT <select id="project"><option value="all">All projects</option></select></label>
          <span id="range-label" class="section-meta"></span>
          <span class="spacer"></span>
          <button type="button" id="toggle-table" class="secondary">TABLE</button>
        </div>
        <p id="source-note" class="source-note">Loading issues from every registered project.</p>
      </section>

      <section class="summary kpis" id="kpis" aria-label="Headline numbers"></section>

      <div id="charts" class="charts"></div>

      <section id="releases" class="panel releases-panel" aria-label="Releases in range"></section>

      <section id="breakdown" class="panel hidden" aria-label="Per project breakdown"></section>

      <section id="table-wrap" class="panel hidden" aria-label="Daily table"></section>
    </main>
  </div>
  <script src="/lib/run-vocabulary.js" defer></script>
  <script src="/metrics.js" defer></script>
</body>
</html>
