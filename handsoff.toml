[project]
name = "project-handsoff"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
# "auto" selects the first installed adapter in this order: Codex, then
# Claude Code. Set any role explicitly to override its automatic choice.
architect = "auto"
supervisor = "auto"
implementer = "auto"
reviewer = "auto"

[models]
# Use "default" to inherit the runner's configured model, or enter an exact
# model ID/alias supported by the selected adapter.
architect = "default"
supervisor = "default"
implementer = "default"
reviewer = "default"

[fallback_policy]
# Ordered replacement profiles used only by the pure fallback planner.
# "auto" is intentionally not valid here: every fallback is explicit.
max_failovers_per_role = 2
architect = []
supervisor = []
implementer = []
reviewer = []

[checks]
# Shell commands the supervisor actually runs via `handsoff_supervisor.py verify`.
# Each criterion's evidence should point at one of these having run, not a
# free-text claim. Example: commands = ["pytest tests/ -q", "npm test"]
commands = ["python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_config_round_trip_preserves_order_and_legacy_defaults", "python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_selection_orders_and_skips_unavailable_profiles_with_audit", "python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_invalid_profiles_are_skipped_with_safe_audit_reasons", "python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_recovery_categories_caps_and_exhaustion_pause", "python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_reviewer_independence_survives_fallback", "python3 -m unittest tests.test_handsoff_supervisor.TestFallbackPolicy.test_dashboard_edits_fallbacks_without_mutating_current_session"]
# Commands that verify the deployed system. Phase 8 is blocked until these
# run successfully after deployment approval.
live_commands = ["python3 -c \"import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/dashboard')); assert data['initialized'] and data['status']['deployment_approved'] and data['status']['status'] == 'ready_to_deploy'\""]
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 600
